name: Build Chuwi Hi10 Pro Bliss kernel

on:
  push:
    branches:
      - chuwi-hi10pro-kernel
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout build branch
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential clang-17 flex git libelf-dev libssl-dev \
            lld-17 llvm-17 make python3 rsync dwarves zstd

      - name: Clone Gloria kernel source
        run: |
          git clone --branch gloria https://github.com/hmtheboy154/Darkmatter-kernel.git kernel
          cd kernel
          git checkout fcfc7a6d64c876910e5102d6c41cd4d61cd3e418
          git submodule update --init --recursive || true
          head -n 6 Makefile
          cat localversion || true

      - name: Apply CWI529 DMI patch
        run: |
          python3 scripts/patch_chuwi_hi10pro.py kernel
          cd kernel
          git diff --check
          git diff > ../chuwi-hi10pro-cwi529.patch
          cat ../chuwi-hi10pro-cwi529.patch

      - name: Integrate KernelSU v0.9.5
        run: |
          cd kernel
          curl -LSs https://raw.githubusercontent.com/tiann/KernelSU/v0.9.5/kernel/setup.sh | bash -s v0.9.5
          test -d KernelSU
          git -C KernelSU describe --tags --always

      - name: Configure kernel
        run: |
          cd kernel
          curl -fsSL https://raw.githubusercontent.com/hmtheboy154/Darkmatter-kernel/gloria/arch/x86/configs/android-x86_64_defconfig -o .config
          printf '%s\n' '-gloria-xanmod1' > localversion
          scripts/config --enable KSU
          scripts/config --enable KPROBES
          scripts/config --enable HAVE_KPROBES
          scripts/config --enable KPROBE_EVENTS
          make LLVM=-17 LLVM_IAS=1 olddefconfig
          grep -E 'CONFIG_KSU|CONFIG_KPROBES|CONFIG_HAVE_KPROBES|CONFIG_KPROBE_EVENTS|CONFIG_TOUCHSCREEN_SILEAD|CONFIG_TOUCHSCREEN_DMI|CONFIG_DRM' .config | head -n 80 || true
          grep -q '^CONFIG_KSU=y' .config

      - name: Build bzImage
        run: |
          cd kernel
          make -j"$(nproc)" LLVM=-17 LLVM_IAS=1 bzImage
          make LLVM=-17 LLVM_IAS=1 kernelrelease | tee ../KERNEL_RELEASE.txt
          cp arch/x86/boot/bzImage ../kernel-chuwi-hi10pro-cwi529-ksu095
          echo fcfc7a6d64c876910e5102d6c41cd4d61cd3e418 > ../SOURCE_COMMIT.txt

      - name: Verify artifact
        run: |
          ls -lh kernel-chuwi-hi10pro-cwi529-ksu095 chuwi-hi10pro-cwi529.patch SOURCE_COMMIT.txt KERNEL_RELEASE.txt
          sha256sum kernel-chuwi-hi10pro-cwi529-ksu095 | tee SHA256SUMS.txt

      - name: Upload patched kernel
        uses: actions/upload-artifact@v4
        with:
          name: chuwi-hi10pro-cwi529-ksu095-kernel
          if-no-files-found: error
          retention-days: 14
          path: |
            kernel-chuwi-hi10pro-cwi529-ksu095
            chuwi-hi10pro-cwi529.patch
            SOURCE_COMMIT.txt
            KERNEL_RELEASE.txt
            SHA256SUMS.txt
