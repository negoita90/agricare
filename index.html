<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#143c2c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="AgriCare" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <title>AgriCare</title>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Assistente agricolo</p>
        <h1>AgriCare</h1>
      </div>
      <button id="installBtn" class="icon-btn hidden" aria-label="Installa app">＋</button>
    </header>

    <main id="app" class="content"></main>

    <nav class="tabbar" aria-label="Navigazione principale">
      <button data-view="today" class="tab active"><span>🏠</span><small>Oggi</small></button>
      <button data-view="crops" class="tab"><span>🌳</span><small>Colture</small></button>
      <button data-view="calendar" class="tab"><span>📅</span><small>Calendario</small></button>
      <button data-view="log" class="tab"><span>✅</span><small>Registro</small></button>
      <button data-view="more" class="tab"><span>⚙️</span><small>Altro</small></button>
    </nav>
  </div>

  <dialog id="taskDialog">
    <form method="dialog" class="dialog-card" id="taskForm">
      <button class="close" value="cancel" aria-label="Chiudi">×</button>
      <h2 id="dialogTitle">Registra attività</h2>
      <input type="hidden" id="taskId" />
      <label>Data<input id="doneDate" type="date" required /></label>
      <label>Prodotto / intervento<input id="product" type="text" placeholder="Es. ossicloruro di rame" /></label>
      <label>Dose / note<textarea id="notes" rows="4" placeholder="Inserisci dose da etichetta, meteo, osservazioni…"></textarea></label>
      <button class="primary" value="default">Salva nel registro</button>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
